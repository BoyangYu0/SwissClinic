name: Deploy Static Site

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build Static Site
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate static data
        if: github.event_name == 'workflow_dispatch'
        run: pnpm data:validate -- --data data/current

      - name: Typecheck
        if: github.event_name == 'workflow_dispatch'
        run: pnpm typecheck

      - name: Lint
        if: github.event_name == 'workflow_dispatch'
        run: pnpm lint

      - name: Test
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test

      - name: Build static site
        run: pnpm build

      - name: Verify static output
        run: test -f apps/web/dist/site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/site

  deploy:
    name: Deploy To GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check that this is still the master tip
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer revision is on master. Skipping deployment of $GITHUB_SHA."
          fi

      - name: Deploy
        if: steps.freshness.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
