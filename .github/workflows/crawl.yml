name: Crawl Data Refresh

on:
  workflow_dispatch:
    inputs:
      create_pull_request:
        description: "Open a pull request with generated data changes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      timeout_ms:
        description: "Per-page fetch timeout in milliseconds"
        required: true
        default: "15000"
        type: string
      max_retries:
        description: "Retries for transient fetch errors"
        required: true
        default: "1"
        type: string
      respect_delay_ms:
        description: "Delay between fetched URLs in milliseconds"
        required: true
        default: "1000"
        type: string

  schedule:
    - cron: "17 4 * * *"
      timezone: "Europe/Zurich"

permissions: {}

jobs:
  crawl:
    name: Crawl And Build Data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.refresh.outputs.pull-request-number }}
      pr_operation: ${{ steps.refresh.outputs.pull-request-operation }}
      pr_sha: ${{ steps.refresh.outputs.pull-request-head-sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Validate source registry with dry-run crawl
        run: pnpm crawl -- --sources packages/sources/sources.yaml --out data/snapshots/dry-run --dry-run

      - name: Generate pre-crawl coverage reports
        run: pnpm coverage:report -- --sources packages/sources/sources.yaml --data data/current --out data/current

      - name: Crawl official source pages
        run: pnpm crawl -- --sources packages/sources/sources.yaml --out data/snapshots/current-run --timeout-ms "${{ inputs.timeout_ms || '15000' }}" --max-retries "${{ inputs.max_retries || '1' }}" --respect-delay-ms "${{ inputs.respect_delay_ms || '1000' }}"

      - name: Summarize crawl report
        run: |
          node -e "const r=require('./data/snapshots/current-run/crawler-report.json'); console.log(JSON.stringify({sourceCount:r.sourceCount,urlCount:r.urlCount,successCount:r.successCount,failureCount:r.failureCount,skippedCount:r.skippedCount,duplicateUrlCount:r.duplicateUrlCount}, null, 2));"
          {
            echo "## Crawl report"
            echo ""
            node -e "const r=require('./data/snapshots/current-run/crawler-report.json'); console.log('- Sources: '+r.sourceCount); console.log('- URLs: '+r.urlCount); console.log('- Successes: '+r.successCount); console.log('- Failures: '+r.failureCount); console.log('- Skipped: '+r.skippedCount); console.log('- Duplicates: '+r.duplicateUrlCount);"
            echo ""
            echo "Review data/snapshots/current-run/crawler-report.json before merging generated data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build static data
        run: pnpm build:data -- --snapshots data/snapshots/current-run --out data/current --sources packages/sources/sources.yaml --exports data/exports

      - name: Generate lead-time reports
        run: pnpm lead-time:build -- --data data/current

      - name: Generate review-needed report
        run: pnpm review:report -- --data data/current --out data/current/review-needed.md

      - name: Generate coverage reports
        run: pnpm coverage:report -- --sources packages/sources/sources.yaml --data data/current --out data/current

      - name: Generate reliability audit
        run: pnpm reliability:audit -- --data data/current --sources packages/sources/sources.yaml --out data/current

      - name: Validate generated static data
        run: pnpm data:validate -- --data data/current

      - name: Build static site
        run: pnpm build

      - name: Upload generated data artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiss-clinical-placement-generated-data
          path: |
            data/current/
            data/exports/
            data/snapshots/current-run/crawler-report.json
            apps/web/dist/site/

      - name: Create pull request
        id: refresh
        if: github.event_name == 'schedule' || inputs.create_pull_request == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/manual-crawl-refresh
          add-paths: |
            data/current/
            data/exports/
          delete-branch: true
          title: "chore(data): refresh crawl outputs"
          commit-message: "chore(data): refresh crawl outputs"
          body: |
            Manual crawl refresh generated by GitHub Actions.

            Review before merging:
            - data/current/review-needed.md
            - data/current/reliability-audit.md
            - data/current/source-coverage.md
            - data/current/institution-coverage.md
            - data/current/record-coverage.md
            - data/current/coverage-by-baseline.md
            - data/current/lead-time-summary.json
            - data/snapshots/current-run/crawler-report.json
          labels: data-refresh

  approve-ci:
    name: Approve CI for the generated data PR
    if: >-
      github.ref == 'refs/heads/master' &&
      (needs.crawl.outputs.pr_operation == 'created' || needs.crawl.outputs.pr_operation == 'updated')
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Find and approve the matching CI run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.crawl.outputs.pr_number }}
          PR_SHA: ${{ needs.crawl.outputs.pr_sha }}
          REFRESH_BRANCH: data/manual-crawl-refresh
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_SHA" =~ ^[0-9a-f]{40}$ ]]

          for attempt in {1..12}; do
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            if ! jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$REFRESH_BRANCH" --arg sha "$PR_SHA" '
              .state == "open" and .user.login == "github-actions[bot]" and
              .base.ref == "master" and .base.repo.full_name == $repo and
              .head.repo.full_name == $repo and .head.ref == $branch and .head.sha == $sha
            ' <<< "$pr" > /dev/null; then
              echo "PR #$PR_NUMBER no longer matches this generated refresh. Skipping approval."
              exit 0
            fi

            runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f event=pull_request -f branch="$REFRESH_BRANCH" -f head_sha="$PR_SHA")
            run=$(jq -c --arg repo "$GITHUB_REPOSITORY" --argjson pr "$PR_NUMBER" '
              first(.workflow_runs[] | select(
                .actor.login == "github-actions[bot]" and .head_repository.full_name == $repo and
                any(.pull_requests[]; .number == $pr)
              )) // empty
            ' <<< "$runs")
            if [[ -n "$run" ]]; then
              run_id=$(jq -r '.id' <<< "$run")
              if [[ $(jq -r '.conclusion' <<< "$run") == action_required ]]; then
                if gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"; then
                  echo "Approved CI run $run_id for PR #$PR_NUMBER."
                  exit 0
                fi
              else
                echo "CI run $run_id for PR #$PR_NUMBER needs no approval."
                exit 0
              fi
            fi
            sleep 5
          done

          echo "::error::Could not approve the CI run for generated PR #$PR_NUMBER at $PR_SHA."
          exit 1
